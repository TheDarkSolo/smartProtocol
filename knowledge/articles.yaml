- id: koap_64_1
  code: "ст. 64-1 КоАП РК"
  disposition_ru: >
    При малозначительности совершенного административного правонарушения
    судья, орган (должностное лицо), уполномоченный рассматривать дела об
    административных правонарушениях, может освободить лицо, совершившее
    административное правонарушение, от административной ответственности,
    ограничившись устным замечанием.
  source_url: >
    https://kodeksy-kz.com/ka/ob_administrativnyh_pravonarusheniyah/64-1.htm
  checked_at: "2026-09-09"
  confidence: corroborated_by_two_secondary_sources
  note: >
    Прямой доступ к adilet.zan.kz не удался (та же ошибка сертификата).
    Подтверждено независимой сводкой веб-поиска (упомянула статью 64-1 по
    номеру и содержанию до прямого запроса текста) и прямым запросом текста
    статьи с зеркала — совпадают. Статья добавлена в Кодекс Законом РК от
    28.12.2017 № 127-VI. Финальная сверка по adilet.zan.kz напрямую
    по-прежнему обязательна перед использованием для реального клиента.
    Внимание: в отличие от остальных оснований в этом файле, малозначительность
    НЕ отрицает факт нарушения — она признаёт его и просит освобождения от
    ответственности с устным замечанием. Формулировка просительной части в
    knowledge/grounds.yaml для соответствующего основания должна отражать
    именно это, а не "отменить постановление в связи с отсутствием состава".
