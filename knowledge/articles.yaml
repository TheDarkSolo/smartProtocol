- id: koap_31_ch2
  code: "ч.2 ст. 31 КоАП РК"
  disposition_ru: >
    Собственник (владелец) транспортного средства освобождается от
    административной ответственности за правонарушение, совершённое с
    участием этого транспортного средства и зафиксированное в автоматическом
    режиме, если в ходе проверки по его сообщению или заявлению будет
    установлено лицо, во владении или пользовании которого оно находилось в
    момент фиксации правонарушения, либо будет установлено, что транспортное
    средство выбыло из его обладания в результате противоправных действий
    других лиц.
  source_url: >
    https://kodeksy-kz.com/ob_administrativnyh_pravonarusheniyah/31.htm ;
    https://prg.kz/document/?doc_id=38253687 (постатейный комментарий Минюста РК)
  checked_at: "2026-09-09"
  confidence: corroborated_by_two_secondary_sources
  note: >
    Прямой доступ к adilet.zan.kz не удался (инструмент фетчинга не смог
    проверить сертификат сайта) — подтверждено двумя независимыми зеркалами,
    текст совпадает дословно. Часть 1 этой же статьи 31 уже буквально
    напечатана в каждом реальном постановлении, прошедшем через проект
    ("в соответствии с частью 1 статьи 31 ... Кодекса"), что косвенно
    подтверждает существование и нумерацию статьи. Финальная сверка по
    adilet.zan.kz напрямую по-прежнему обязательна перед использованием
    для реального клиента — этот статус сильнее, чем "unverified" у
    остальных записей файла, но не заменяет её.

- id: koap_37
  code: "ст. 37 КоАП РК"
  disposition_ru: >
    Не является административным правонарушением причинение вреда охраняемым
    настоящим Кодексом интересам в состоянии крайней необходимости, то есть
    для устранения опасности, непосредственно угрожающей жизни, здоровью,
    правам и законным интересам данного лица или иных лиц, интересам общества
    или государства, если эта опасность не могла быть устранена иными
    средствами и при этом не допущено превышения пределов крайней
    необходимости.
  source_url: >
    https://kodeksy-kz.com/ka/ob_administrativnyh_pravonarusheniyah/37.htm
    (русский текст статьи, дословно совпадает с независимой сводкой поиска
