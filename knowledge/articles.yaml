  checked_at: "2026-09-09"
  confidence: corroborated_by_two_secondary_sources
  note: >
    Прямой доступ к adilet.zan.kz не удался (та же ошибка сертификата, что
    и у ст. 31). Русский и казахский тексты статьи на зеркале совпадают по
    смыслу дословно; независимая сводка веб-поиска процитировала ту же
    формулировку без прямого запроса текста. Финальная сверка по
    adilet.zan.kz напрямую по-прежнему обязательна перед использованием для
