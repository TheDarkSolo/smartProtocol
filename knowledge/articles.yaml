# База норм права для подстановки в шаблоны жалоб.
#
# ПРАВИЛО: ни одна запись здесь не считается пригодной для продакшена, пока
# source_url не указывает на adilet.zan.kz (или sud.gov.kz для практики) и
# checked_at не проставлена реальной датой сверки. Записи ниже взяты из
# примера жалобы, предоставленного пользователем (реальный кейс, который и
# запустил этот проект), а не проверены заново этим агентом — это временное
# состояние до прогона kz-legal-researcher.

