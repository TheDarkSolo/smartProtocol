# Каталог оснований обжалования. Каждое основание попадает в жалобу только
# если у пользователя есть подтверждающие его факты (appeal-drafter agent).

- id: yellow_signal_no_safe_stop
  title_ru: "Продолжение движения на жёлтый сигнал при невозможности безопасно остановиться"
  applies_to_articles: [koap_599_ch1]
  supporting_norms: [pdd_5_6]
  closing_norms: [koap_10]
  strength: strong
  required_facts:
    - distance_to_stop_line_at_signal_change   # был близко к стоп-линии в момент включения сигнала
    - braking_would_be_unsafe                  # экстренное торможение создавало опасность (занос, удар сзади, тёмное время суток, гололёд и т.п.)
    - continued_through_intersection           # завершил проезд перекрёстка, а не остановился на нём
  narrative_prompt_hint: >
    Изложить только сообщённые пользователем обстоятельства: расстояние до
    стоп-линии в момент включения жёлтого, почему экстренное торможение было
    небезопасно (дорожные условия, транспорт сзади, время суток), и что
    водитель завершил проезд перекрёстка. Не добавлять деталей, которых нет
    во входных данных. Не упоминать номера статей и пунктов — они уже есть в
    шаблоне отдельно.
  document_requests:
    - "Отменить {decree_kind} № {decree_number} от {decree_date} г."
    - "Производство по делу прекратить в связи с отсутствием состава административного правонарушения."

- id: not_the_driver
  title_ru: "В момент фиксации транспортным средством управлял/пользовался другой человек"
  # Пустой список — не забыто, а осознанно: применимо к любому нарушению,
  # зафиксированному в автоматическом режиме, независимо от статьи КоАП.
  applies_to_articles: []
  universal: true
  supporting_norms: [koap_31_ch2]
  closing_norms: [koap_10]
  strength: strong
  required_facts:
    - who_was_actually_using_vehicle   # кто в действительности владел/пользовался ТС в момент нарушения
    - how_vehicle_left_possession      # основание: аренда, доверенность, продажа, угон и т.п.
  narrative_prompt_hint: >
    Изложить только сообщённые пользователем обстоятельства: кто в
    действительности владел или пользовался транспортным средством в момент
    фиксации нарушения и на каком основании (договор аренды, доверенность,
    продажа, угон и т.п.). Не добавлять деталей, которых нет во входных
    данных. Не упоминать номера статей — они уже есть в шаблоне отдельно.
  document_requests:
    - "Отменить {decree_kind} № {decree_number} от {decree_date} г."
    - "Производство по делу прекратить в связи с тем, что заявитель не является лицом, подлежащим привлечению к административной ответственности за данное правонарушение."

- id: extreme_necessity
  title_ru: "Нарушение допущено в состоянии крайней необходимости"
  # Применимо к любому нарушению — угроза жизни/здоровью не зависит от того,
  # какое именно правило пришлось нарушить, чтобы её устранить.
  applies_to_articles: []
  universal: true
  supporting_norms: [koap_37]
  closing_norms: [koap_10]
  strength: strong
  required_facts:
    - danger_description        # какая опасность угрожала жизни/здоровью/правам — своим или чужим
    - no_other_way_to_avert_it   # почему нельзя было устранить опасность иначе, не нарушая ПДД
  narrative_prompt_hint: >
    Изложить только сообщённые пользователем обстоятельства: в чём состояла
    непосредственная опасность жизни, здоровью или правам (своим или чужим),
    и почему её нельзя было устранить иначе, кроме как нарушив правило, за
    которое вынесено постановление. Не добавлять деталей, которых нет во
    входных данных. Не упоминать номера статей — они уже есть в шаблоне
    отдельно.
  document_requests:
    - "Отменить {decree_kind} № {decree_number} от {decree_date} г."
    - "Производство по делу прекратить в связи с отсутствием состава административного правонарушения ввиду совершения деяния в состоянии крайней необходимости."

- id: insignificance
  title_ru: "Малозначительность правонарушения"
  # Применимо к любому нарушению — оценка малозначительности не привязана
  # к конкретной статье, а зависит от обстоятельств и последствий.
  applies_to_articles: []
  universal: true
  # Признаёт факт нарушения и просит снисхождения — не отрицает вину, в
  # отличие от остальных оснований файла. Меняет вступительную фразу
  # документа (см. appeal_draft.py: intro_line) — без этого поля документ
  # сначала пишет "не согласен", а затем признаёт нарушение, что и есть то
  # внутреннее противоречие, которое обязан ловить compliance-reviewer.
  posture: mitigate
  supporting_norms: [koap_64_1]
  # Без koap_10: малозначительность не отрицает вину и сам факт нарушения,
  # поэтому презумпция невиновности здесь неуместна как логическое основание.
  closing_norms: []
  strength: weak
  required_facts:
    - why_insignificant   # чем нарушение отличалось от типичного случая: отсутствие вреда, исключительные обстоятельства и т.п.
  narrative_prompt_hint: >
    Изложить только сообщённые пользователем обстоятельства, объясняющие,
    почему конкретно это нарушение не представляло существенной угрозы
    охраняемым отношениям (отсутствие вреда, кратковременность, исключительные
    личные обстоятельства и т.п.). Не отрицать сам факт нарушения — это
    основание строится на признании факта и просьбе о снисхождении, а не на
    оспаривании вины. Не добавлять деталей, которых нет во входных данных.
  document_requests:
    - "Освободить от административной ответственности по {decree_kind_dative} № {decree_number} от {decree_date} г. в связи с малозначительностью совершенного правонарушения, ограничившись устным замечанием."
