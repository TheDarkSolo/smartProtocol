# Каталог оснований обжалования. Каждое основание попадает в жалобу только
# если у пользователя есть подтверждающие его факты (appeal-drafter agent).

- id: yellow_signal_no_safe_stop
  title_ru: "Продолжение движения на жёлтый сигнал при невозможности безопасно остановиться"
  applies_to_articles: [koap_599_ch1]
  supporting_norms: [pdd_5_6]
  closing_norms: [koap_10]
  strength: strong
  required_facts:
    - distance_to_stop_line_at_signal_change   # был близко к стоп-линии в момент включения сигнала
    - braking_would_be_unsafe                  # экстренное торможение создавало опасность (занос, удар сзади, тёмное время суток, гололёд и т.п.)
    - continued_through_intersection           # завершил проезд перекрёстка, а не остановился на нём
  narrative_prompt_hint: >
    Изложить только сообщённые пользователем обстоятельства: расстояние до
    стоп-линии в момент включения жёлтого, почему экстренное торможение было
    небезопасно (дорожные условия, транспорт сзади, время суток), и что
    водитель завершил проезд перекрёстка. Не добавлять деталей, которых нет
    во входных данных. Не упоминать номера статей и пунктов — они уже есть в
    шаблоне отдельно.
  document_requests:
    - "Отменить {decree_kind} № {decree_number} от {decree_date} г."
    - "Производство по делу прекратить в связи с отсутствием состава административного правонарушения."

- id: not_the_driver
  title_ru: "В момент фиксации транспортным средством управлял/пользовался другой человек"
  # Пустой список — не забыто, а осознанно: применимо к любому нарушению,
  # зафиксированному в автоматическом режиме, независимо от статьи КоАП.
  applies_to_articles: []
  universal: true
  supporting_norms: [koap_31_ch2]
  closing_norms: [koap_10]
  strength: strong
  required_facts:
    - who_was_actually_using_vehicle   # кто в действительности владел/пользовался ТС в момент нарушения
    - how_vehicle_left_possession      # основание: аренда, доверенность, продажа, угон и т.п.
  narrative_prompt_hint: >
    Изложить только сообщённые пользователем обстоятельства: кто в
    действительности владел или пользовался транспортным средством в момент
    фиксации нарушения и на каком основании (договор аренды, доверенность,
    продажа, угон и т.п.). Не добавлять деталей, которых нет во входных
    данных. Не упоминать номера статей — они уже есть в шаблоне отдельно.
  document_requests:
    - "Отменить {decree_kind} № {decree_number} от {decree_date} г."
    - "Производство по делу прекратить в связи с тем, что заявитель не является лицом, подлежащим привлечению к административной ответственности за данное правонарушение."
